version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Pinned to forks on purpose, updated by hand
      - dependency-name: "biome_*"
      - dependency-name: "tower-lsp"
      # Updated only when we send in a new Zed extension
      - dependency-name: "zed_extension_api"
    groups:
      # Major updates are intentionally ungrouped so each gets its own PR
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/editors/code"
    schedule:
      interval: "weekly"
    ignore:
      # Updated only when `engines.vscode` changes
      - dependency-name: "@types/vscode"
      # Updated only when `engines.vscode`'s bundled Node version changes,
      # but we still accept patch and minor updates
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Major updates are intentionally ungrouped so each gets its own PR
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
