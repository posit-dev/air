version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Pinned to forks on purpose, updated by hand
      - dependency-name: "biome_*"
      - dependency-name: "tower-lsp"
    groups:
      # Major updates are intentionally ungrouped so each gets its own PR
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/editors/code"
    schedule:
      interval: "weekly"
    groups:
      # Major updates are intentionally ungrouped so each gets its own PR
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
