name: "Test - health"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    name: "Health"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Codegen is up to date
        run: just gen-grammar && git diff --exit-code

      - name: Parser markdown snapshots are up to date
        run: cargo run -p xtask_accept && git diff --exit-code
