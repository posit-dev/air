name: "Test / Code extension"

on:
  push:
    branches:
      - main
    paths: ["editors/code/**"]
  pull_request:
    paths: ["editors/code/**"]
  workflow_dispatch:

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Update build environment
        run: |
          sudo apt-get update

      - name: Install rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Air
        run: |
          cargo install --path "crates/air"

      # `@vscode/test-electron` requires Node 22+, so don't rely on the runner's default
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install X Virtual Framebuffer
        run: |
          sudo apt-get install xvfb

      - name: Run tests
        env:
          AIR_LOG_LEVEL: trace
        run: |
          export PATH="~/.cargo/bin/:$PATH"
          cd editors/code
          npm ci
          xvfb-run npm run test
